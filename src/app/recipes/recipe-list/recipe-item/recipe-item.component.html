@if (recipe) {
  <a style="cursor: pointer">
    <div class="list-group-item list-group-item-action mb-1" style="height: 150px; padding: 6px;" [routerLink]="[index]"
      queryParamsHandling="merge" routerLinkActive="active">
      <div class="overhead-badge-title-over-image">
        <h4 class="list-group-item-heading">
          {{recipe.Name}}
        </h4>
      </div>
      @if (!recipe.ImagePath) {
        <div class="image-placeholder">
          <h4>195x130</h4>
        </div>
      }
      @if (recipe.ImagePath) {
        <img [src]="recipe.ImagePath" [alt]="recipe.Name" class="rounded d-block float-right"
          style="height: 130px;">
      }
    </div>
  </a>
}
