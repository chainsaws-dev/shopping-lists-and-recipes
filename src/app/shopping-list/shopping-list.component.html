@if (!IsLoading) {
  <div class="row">
    <div class="col">
      <app-shopping-edit></app-shopping-edit>
      <hr>
        @if (ShowMessage) {
          <ngb-alert [type]="MessageType" (close)="ShowMessage = false">{{  ResponseFromBackend.Error.Message | FirstLetterUpperPipe }}</ngb-alert>
        }
        <ul class="list-group mb-1">
          @for (ingredient of ingredients; track ingredient) {
            <a style="cursor: pointer;" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
              [ngClass]="ShopListServ.IsCurrentSelected(ingredient) ? 'active' : ''"
              (click)="ShopListServ.SelectItemShopList(ingredient)">{{ ingredient.Name }}
              <span class="badge bg-primary rounded-pill">{{ingredient.Amount}}</span>
            </a>
          }
        </ul>
        @if (slcollectionSize>slPageSize) {
          <ngb-pagination
            [collectionSize]="slcollectionSize"
            [pageSize]="slPageSize"
            [page]="slCurrentPage"
            [rotate]="true"
            [boundaryLinks]="true"
            [maxSize]="11"
          (pageChange)="OnPageChanged($event)"></ngb-pagination>
        }
      </div>
    </div>
  }
  <div class="text-center">
    @if (IsLoading) {
      <div class="spinner-border" role="status">
        <span class="visually-hidden-focusable">{{ 'Loading'|translate }}</span>
      </div>
    }
  </div>
